<!DOCTYPE html>
<html>

<head>
    <title>Gallery - Paradise Retreat</title>

    <link rel="stylesheet" href="style.css">
</head>
<script src="script.js" defer></script>
<body>

    <section id="gallery">

        <!-- GALLERY HEADER -->
        <div class="gallery-header">
            <div class="gallery-heading">
                <span class="gallery-label">DISCOVER ARNA RETREAT</span>
                <h2>ARNA RETREAT Gallery</h2>
                <p class="gallery-description">
                    Take a glimpse into our peaceful surroundings
                    and unforgettable resort experiences.
                </p>
            </div>

            <div class="add-photo-wrapper">
                <button type="button" class="add-photo-button"
                        onclick="document.getElementById('galleryPhotoInput').click()">
                    <span>+</span> Add Photo
                </button>

                <input type="file"
                    id="galleryPhotoInput"
                    accept="image/*"
                    hidden>
            </div>
        </div>
            

        <div class="gallery-container">

            <div class="gallery-item">
                <img src="images/gallery8.jpeg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/resort.jpeg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery7.jpg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery1.jpg" alt="Beautiful Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery2.jpeg" alt="Resort Experience">
            </div>

            <div class="gallery-item">
                <img src="images/gallery9.jpeg" alt="Resort heart View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery3.jpg" alt="Nature View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery4.jpg" alt="Resort Surroundings">
            </div>

            <div class="gallery-item">
                <img src="images/gallery5.jpg" alt="Beautiful Resort">
            </div>

            <div class="gallery-item">
                <img src="images/gallery6.jpg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery10.jpeg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery11.jpeg" alt="Resort View">
            </div>

            <div class="gallery-item">
                <img src="images/gallery12.jpeg" alt="Resort View">
            </div>

        </div>

    </section>

</body>

</html>
