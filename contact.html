<!DOCTYPE html>
<html>

<head>
    <title>Contact Us - Harna Resort</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section id="contact-page">

        <p class="about-label">CONTACT US</p>
        <h2>Contact Harna Resort</h2>

        <p class="contact-description">
            Have a question or want to plan your stay?
            Get in touch with us and we will be happy to help.
        </p>

        <div class="contact-container">

            <!-- Contact Information -->

            <div class="contact-info">

                <h3>We'd Love to Hear From You</h3>

                <p>📍 Bangalore, Karnataka</p>
                <p>📞 +91 98765 43210</p>
                <p>📧 info@HARNAretreat.com</p>
                <p>🕐 Available 24/7</p>

                <img src="images/home-contact1.jpeg" alt="Harna Resort">

            </div>

            <!-- Contact Form -->

            <div class="contact-form">

                <h3>Send Us a Message</h3>

                <form id="contact-form">

                    <input
                        type="text"
                        id="contact-name"
                        placeholder="Enter your Name"
                        required
                    >

                    <input
                        type="email"
                        id="contact-email"
                        placeholder="Enter your Email"
                        required
                    >

                    <input
                        type="text"
                        id="contact-subject"
                        placeholder="Enter your Subject"
                        required
                    >

                    <textarea
                        id="contact-message"
                        placeholder="Enter your Message"
                        required
                    ></textarea>

                    <button type="submit">
                        Send Message
                    </button>

                </form>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
