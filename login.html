<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ARNA RETREAT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-container">

        <!-- Left Side -->
        <div class="auth-image login-image">
            <div class="auth-image-content">
                <span class="auth-label">WELCOME BACK</span>

                <h1>Your peaceful escape awaits.</h1>

                <p>
                    Sign in to continue your journey
                    with comfort, luxury and unforgettable experiences.
                </p>
            </div>
        </div>

        <!-- Right Side -->
        <div class="auth-form-section">

            <a href="home.html" class="auth-logo">
                ARNA <span>RETREAT</span>
            </a>

            <div class="auth-heading">
                <h2>Welcome Back</h2>

                <p>Sign in to access your account.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>

                    <input
                        type="password"
                        id="loginPassword"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Log In
                    <span>→</span>
                </button>

                <p id="loginMessage" class="auth-message"
                   aria-live="polite"></p>

            </form>

            <div class="auth-divider">
                <span>YOUR COMFORT, OUR PRIORITY</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

            

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
